name: 편입영어 학습 앱 배포

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 학습 데이터 검증
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-data-v2.mjs

      - name: JavaScript 구문 검사
        run: |
          node --check app.js
          node --check app-enhancements.js
          node --check app-ux-parity.js
          node --check app-update.js
          node --check content/vocabulary.js
          node --check content/grammar.js
          node --check content/grammar-v2.js
          node --check sw.js

      - name: GitHub Pages 구성 확인
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: 배포 파일 구성
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'README.md' \
            --exclude 'scripts' \
            ./ _site/

      - name: 정적 앱 업로드
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
