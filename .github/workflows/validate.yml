name: 데이터 검증

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 학습 데이터 검증
        run: node scripts/validate-data-v2.mjs
      - name: 편입영어 실전형 UX 회귀 검증
        run: node scripts/validate-exam-ux.mjs
      - name: 채점 후 선지 고정 검증
        run: node scripts/validate-question-stability.mjs
      - name: 어휘 문제 품질 검증
        run: node scripts/validate-vocab-exam.mjs
      - name: 문법 실전형 출제 검증
        run: node scripts/validate-grammar-exam.mjs
      - name: 최신 학습 기록 기반 출제 우선순위 검증
        run: node scripts/validate-progress-priority.mjs
      - name: 앱 자바스크립트 구문 검증
        run: |
          node --check app.js
          node --check app-enhancements.js
          node --check exam-mode.js
          node --check grammar-exam.js
          node --check grammar-exam-2026-09-11.js
          node --check vocab-exam.js
          node --check app-update.js
          node --check new-problems.js
          node --check question-stability.js
          node --check grammar-hierarchy.js
          node --check all-study.js
          node --check content/vocabulary.js
          node --check content/vocabulary-02.js
          node --check content/vocabulary-hackers-750-day01.js
          node --check content/vocabulary-hackers-750-day02.js
          node --check content/vocabulary-hackers-750-day03-05.js
          node --check content/vocabulary-hackers-750-day06-08.js
          node --check content/vocabulary-hackers-750-day09-11.js
          node --check content/vocabulary-hackers-750-day12-15.js
          node --check content/grammar-v2.js
          node --check content/grammar-2026-09-11.js
          node --check sw.js
