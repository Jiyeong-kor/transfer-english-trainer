name: PWA 패키지 생성

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 편입영어 실전형 UX 회귀 검증
        run: node scripts/validate-exam-ux.mjs
      - name: 배포 파일 구성
        run: |
          mkdir -p dist/content
          cp index.html styles.css practice.css ux-fixes.css app.js app-enhancements.js exam-mode.js app-update.js new-problems.js manifest.webmanifest sw.js icon.svg dist/
          cp content/vocabulary.js content/grammar-v2.js dist/content/
      - name: PWA 패키지 업로드
        uses: actions/upload-artifact@v4
        with:
          name: transfer-english-trainer-pwa
          path: dist
          if-no-files-found: error
          retention-days: 30
