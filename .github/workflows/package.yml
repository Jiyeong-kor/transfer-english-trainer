name: PWA 패키지 생성

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 파일 구성
        run: |
          mkdir -p dist/content
          cp index.html styles.css practice.css ux-fixes.css app.js app-enhancements.js app-ux-parity.js exam-mode.js app-update.js manifest.webmanifest sw.js icon.svg dist/
          cp content/vocabulary.js content/grammar-v2.js dist/content/
      - name: PWA 패키지 업로드
        uses: actions/upload-artifact@v4
        with:
          name: transfer-english-trainer-pwa
          path: dist
          if-no-files-found: error
          retention-days: 30
