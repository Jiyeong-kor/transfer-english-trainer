name: PWA 패키지 생성

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 편입영어 실전형 UX 회귀 검증
        run: |
          node scripts/validate-exam-ux.mjs
          node scripts/validate-question-stability.mjs
          node scripts/validate-vocab-exam.mjs
          node scripts/validate-grammar-exam.mjs
      - name: 배포 파일 구성
        run: |
          mkdir -p dist/content
          cp index.html styles.css practice.css ux-fixes.css app.js app-enhancements.js exam-mode.js grammar-exam.js grammar-exam-2026-09-11.js vocab-exam.js app-update.js new-problems.js question-stability.js grammar-hierarchy.js all-study.js manifest.webmanifest sw.js icon.svg dist/
          cp content/vocabulary.js content/vocabulary-02.js content/vocabulary-hackers-750-day01.js content/vocabulary-hackers-750-day02.js content/vocabulary-hackers-750-day03-05.js content/vocabulary-hackers-750-day06-08.js content/vocabulary-hackers-750-day09-11.js content/vocabulary-hackers-750-day12-15.js content/grammar-v2.js content/grammar-2026-09-11.js dist/content/
      - name: PWA 패키지 업로드
        uses: actions/upload-artifact@v4
        with:
          name: transfer-english-trainer-pwa
          path: dist
          if-no-files-found: error
          retention-days: 30
